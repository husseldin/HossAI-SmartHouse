# Production Docker Compose Configuration
# Optimized for production deployment with volumes, networks, and resource limits

version: '3.8'

services:
  # PostgreSQL + TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: smarthome-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smarthome}
      POSTGRES_USER: ${POSTGRES_USER:-smarthome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smarthome}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Redis
  redis:
    image: redis:7-alpine
    container_name: smarthome-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?Please set REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Mosquitto MQTT
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smarthome-mqtt
    restart: unless-stopped
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./config/mosquitto/passwd:/mosquitto/config/passwd
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
    ports:
      - "1883:1883"
      - "8883:8883"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # API Gateway
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: smarthome-api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_GATEWAY_PORT: 8000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-smarthome}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smarthome}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      JWT_SECRET: ${JWT_SECRET:?Please set JWT_SECRET}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-http://localhost:3000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60000}
    ports:
      - "8000:8000"
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Device Service
  device-service:
    build:
      context: ./services/device-service
      dockerfile: Dockerfile
    container_name: smarthome-device-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DEVICE_SERVICE_PORT: 8001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-smarthome}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smarthome}
      MQTT_BROKER_URL: mqtt://mosquitto:1883
    networks:
      - backend
    depends_on:
      - postgres
      - mosquitto
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Network Service
  network-service:
    build:
      context: ./services/network-service
      dockerfile: Dockerfile
    container_name: smarthome-network-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NETWORK_SERVICE_PORT: 8002
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-smarthome}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smarthome}
      MQTT_BROKER_URL: mqtt://mosquitto:1883
    networks:
      - backend
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - postgres
      - mosquitto
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8002/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Security Service
  security-service:
    build:
      context: ./services/security-service
      dockerfile: Dockerfile
    container_name: smarthome-security-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SECURITY_SERVICE_PORT: 8003
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-smarthome}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smarthome}
      MQTT_BROKER_URL: mqtt://mosquitto:1883
    networks:
      - backend
    depends_on:
      - postgres
      - mosquitto
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8003/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Automation Engine
  automation-engine:
    build:
      context: ./services/automation-engine
      dockerfile: Dockerfile
    container_name: smarthome-automation-engine
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AUTOMATION_ENGINE_PORT: 8004
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-smarthome}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smarthome}
      MQTT_BROKER_URL: mqtt://mosquitto:1883
    networks:
      - backend
    depends_on:
      - postgres
      - mosquitto
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8004/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Integration Manager
  integration-manager:
    build:
      context: ./services/integration-manager
      dockerfile: Dockerfile
    container_name: smarthome-integration-manager
    restart: unless-stopped
    environment:
      NODE_ENV: production
      INTEGRATION_MANAGER_PORT: 8005
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-smarthome}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smarthome}
      MQTT_BROKER_URL: mqtt://mosquitto:1883
    networks:
      - backend
    depends_on:
      - postgres
      - mosquitto
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8005/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Web UI
  web-ui:
    build:
      context: ./web-ui
      dockerfile: Dockerfile
    container_name: smarthome-web-ui
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - frontend
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  mosquitto-data:
    driver: local
  mosquitto-logs:
    driver: local
