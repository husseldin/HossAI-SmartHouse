# Mosquitto MQTT Broker Configuration

# Listeners
listener 1883
protocol mqtt

listener 9001
protocol websockets

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

# Security (basic auth - for production, use TLS)
allow_anonymous false
password_file /mosquitto/config/passwd

# Connection settings
max_connections -1
max_queued_messages 1000

# Message size
message_size_limit 0

# Retained messages
max_inflight_messages 20
max_queued_bytes 0

# WebSocket settings
websockets_log_level 255

# Performance
set_tcp_nodelay true
